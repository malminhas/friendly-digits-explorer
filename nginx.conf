events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 8081;
        server_name localhost;

        # Set root directory
        root /usr/share/nginx/html;

        # Handle /friendly-digits-explorer/ path
        location /friendly-digits-explorer/ {
            alias /usr/share/nginx/html/friendly-digits-explorer/;
            try_files $uri $uri/ /friendly-digits-explorer/index.html;
        }

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log debug;
    }
} 